name: Build ARM64-V8A Pro Plus Release APK with VirtualHosts

on:
  workflow_dispatch:
  push:
    tags:
      - "plus*"
      - "vhost*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Get Gradle wrapper cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        
      - name: Setup Android NDK
        run: |
          # Install NDK using sdkmanager
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
          echo "NDK installed successfully"
          ls -la $ANDROID_HOME/ndk/
      
      - name: Verify Pro features enabled (IAB.java)
        run: |
          echo "Verifying Pro features are enabled in IAB.java..."
          # Check if isPurchased returns true
          if grep -q "public static boolean isPurchased(String sku, Context context) {" app/src/main/java/eu/faircode/netguard/IAB.java; then
            echo "✓ isPurchased method found"
            # Check if it returns true
            if grep -A 1 "public static boolean isPurchased(String sku, Context context) {" app/src/main/java/eu/faircode/netguard/IAB.java | grep -q "return true;"; then
              echo "✓ isPurchased already returns true (Pro enabled)"
            else
              echo "✗ isPurchased does NOT return true"
              exit 1
            fi
          else
            echo "✗ isPurchased method NOT FOUND"
            exit 1
          fi
          
          # Check if isPurchasedAny returns true
          if grep -q "public static boolean isPurchasedAny(Context context) {" app/src/main/java/eu/faircode/netguard/IAB.java; then
            echo "✓ isPurchasedAny method found"
            # Check if it returns true
            if grep -A 1 "public static boolean isPurchasedAny(Context context) {" app/src/main/java/eu/faircode/netguard/IAB.java | grep -q "return true;"; then
              echo "✓ isPurchasedAny already returns true (Pro enabled)"
            else
              echo "✗ isPurchasedAny does NOT return true"
              exit 1
            fi
          else
            echo "✗ isPurchasedAny method NOT FOUND"
            exit 1
          fi
          
          echo "All Pro features verified successfully!"
      
      - name: Verify VirtualHosts files exist
        run: |
          echo "Verifying VirtualHosts related files..."
          # Check ActivityVirtualHosts.java
          if [ -f "app/src/main/java/eu/faircode/netguard/ActivityVirtualHosts.java" ]; then
            echo "✓ ActivityVirtualHosts.java exists"
          else
            echo "✗ ActivityVirtualHosts.java NOT FOUND"
            exit 1
          fi
          
          # Check AdapterVirtualHosts.java
          if [ -f "app/src/main/java/eu/faircode/netguard/AdapterVirtualHosts.java" ]; then
            echo "✓ AdapterVirtualHosts.java exists"
          else
            echo "✗ AdapterVirtualHosts.java NOT FOUND"
            exit 1
          fi
          
          # Check DatabaseHelper.java for virtual_hosts table
          if grep -q "virtual_hosts" "app/src/main/java/eu/faircode/netguard/DatabaseHelper.java"; then
            echo "✓ DatabaseHelper.java contains virtual_hosts table"
          else
            echo "✗ DatabaseHelper.java does NOT contain virtual_hosts table"
            exit 1
          fi
          
          # Check ServiceSinkhole.java for getHostRedirect method
          if grep -q "getHostRedirect" "app/src/main/java/eu/faircode/netguard/ServiceSinkhole.java"; then
            echo "✓ ServiceSinkhole.java contains getHostRedirect method"
          else
            echo "✗ ServiceSinkhole.java does NOT contain getHostRedirect method"
            exit 1
          fi
          
          echo "All VirtualHosts files verified successfully!"
      
      - name: Prepare signing config
        run: |
          if [ -n "${{ secrets.KEY_BASE64 }}" ]; then
            echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          fi

          if [ -n "${{ secrets.SIGNING_CONFIG }}" ]; then
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          fi
      
      - name: Configure ARM64-V8A Pro Plus build
        run: |
          # Backup original build.gradle
          cp app/build.gradle app/build.gradle.original
          
          # Create a modified build.gradle that builds only arm64-v8a with pro plus features
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'

          def keystorePropertiesFile = rootProject.file("local.properties")
          def keystoreProperties = new Properties()
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

          android {
              compileSdkVersion = 35

              defaultConfig {
                  applicationId = "eu.faircode.netguard"
                  versionName = "2.334-pro-plus"
                  minSdkVersion 22
                  targetSdkVersion 35
                  versionCode = 2025101201
                  archivesBaseName = "NetGuard-Pro-Plus-v$versionName"

                  externalNativeBuild {
                      cmake {
                          cppFlags ""
                          arguments "-DANDROID_PLATFORM=android-22"
                      }
                  }

                  ndkVersion "25.2.9519653"
                  // Only build for arm64-v8a
                  ndk {
                      abiFilters 'arm64-v8a'
                  }

                  packagingOptions {
                      jniLibs {
                          useLegacyPackaging true
                      }
                  }
              }
              signingConfigs {
                  release {
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }

              externalNativeBuild {
                  cmake {
                      path "CMakeLists.txt"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled = true
                      proguardFiles.add(file('proguard-rules.pro'))
                      signingConfig signingConfigs.release
                      buildConfigField "boolean", "PLAY_STORE_RELEASE", "false"
                      buildConfigField "String", "HOSTS_FILE_URI", ""https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts""
                      buildConfigField "String", "GITHUB_LATEST_API", ""https://api.github.com/repos/M66B/NetGuard/releases/latest""
                      // VirtualHosts feature flag
                      buildConfigField "boolean", "VIRTUAL_HOSTS_FEATURE", "true"
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              lint {
                  disable 'MissingTranslation'
              }
              namespace 'eu.faircode.netguard'
              buildFeatures {
                  aidl true
              }
          }

          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.1'
              implementation 'androidx.preference:preference:1.2.1'
              implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
              annotationProcessor 'androidx.annotation:annotation:1.7.0'
              implementation('com.github.bumptech.glide:glide:4.14.2') {
                  exclude group: "com.android.support"
              }
              annotationProcessor 'com.github.bumptech.glide:compiler:4.14.2'
          }
          EOF
          
          echo "Modified build.gradle for ARM64-V8A Pro Plus build with VirtualHosts feature"
      
      - name: Build ARM64-V8A Pro Plus Release APK
        run: |
          # Make gradlew executable
          chmod +x gradlew
          
          # Use the arm64-v8a specific build configuration
          ./gradlew assembleRelease \
            -Pandroid.injected.invoked.from.ide=true \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            --no-daemon \
            --stacktrace \
            -x lint \
            --warning-mode=all
            
      - name: Verify APK output
        run: |
          # Find and list the generated APK
          echo "Generated APK files:"
          find app/build/outputs -name "*.apk" -type f -exec ls -lh {} \;
          
          # Check if arm64-v8a APK exists
          ARM64_APK=$(find app/build/outputs -name "*arm64-v8a*release*.apk" | head -n 1)
          if [ -n "$ARM64_APK" ]; then
            echo "ARM64-V8A Pro Plus Release APK found: $ARM64_APK"
            echo "APK_SIZE=$(ls -lh "$ARM64_APK" | awk '{print $5}')" >> $GITHUB_ENV
            echo "APK_PATH=$ARM64_APK" >> $GITHUB_ENV
          else
            echo "Warning: ARM64-V8A pro plus release APK not found in expected location"
            echo "All APKs:"
            find app/build/outputs -name "*.apk" -type f
          fi
      
      - name: Upload ARM64-V8A Pro Plus Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NetGuard-Pro-Plus-arm64-v8a-release
          path: app/build/outputs/apk/**/*arm64-v8a*release*.apk
          retention-days: 30
      
      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NetGuard-Pro-Plus-all-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
      
      - name: Create GitHub Release with VirtualHosts feature
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          name: NetGuard Pro Plus v${{ github.ref_name }} - VirtualHosts Edition
          body: |
            ## NetGuard Pro Plus - VirtualHosts Edition
            
            ### 🆕 What's New in This Version
            - ✨ **VirtualHosts Feature**: Redirect domain DNS resolution to custom IP addresses
            - 🚀 **Pro Features Enabled**: All premium features unlocked
            - 🔧 **ARM64-V8A Optimized**: Built specifically for ARM64-V8A devices
            
            ### 🌐 VirtualHosts Features
            - **Manual Host Entry**: Add custom domain-to-IP mappings
            - **GitHub520 Auto-Update**: Import latest GitHub hosts automatically
            - **No Root Required**: Works without rooting your device
            - **DNS Interception**: Redirects DNS responses at VPN layer
            
            ### 📝 Technical Details
            - **Build Configuration**: ARM64-V8A only
            - **Version**: ${{ github.ref_name }}-pro-plus
            - **VirtualHosts Files Included**:
              - ActivityVirtualHosts.java - Management interface
              - AdapterVirtualHosts.java - List adapter
              - DatabaseHelper.java - SQLite database with virtual_hosts table
              - ServiceSinkhole.java - DNS interception with getHostRedirect method
            
            ### 🔄 How VirtualHosts Works
            1. DNS requests are intercepted by NetGuard's VPN service
            2. C-layer code (`dns.c`) checks domain against custom hosts map
            3. If match found, A record IP is replaced with custom IP
            4. Original DNS response is discarded, custom response sent
            
            ### 📱 Requirements
            - Android 6.0 (API 22) or higher
            - ARM64-V8A device
            - No root required
            
            ### ⚠️ Important Notes
            - VirtualHosts only affects IPv4 (A records), not IPv6 (AAAA)
            - Enable VirtualHosts in app settings to start using
            - GitHub520 hosts update periodically - check for updates
            
            ### 🔗 Links
            - **Source Code**: https://github.com/${{ github.repository }}
            - **VirtualHosts Documentation**: See VirtualHosts_Changelog.md
            - **GitHub520 Hosts**: https://raw.hellogithub.com/hosts
            
            ### 📦 APK Details
            - **APK Size**: ${{ env.APK_SIZE || 'N/A' }}
            - **Architecture**: ARM64-V8A only
            - **Features**: Pro + VirtualHosts enabled
            - **Build**: Automated GitHub Actions workflow
          files: ${{ env.APK_PATH }}
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
