name: Build ARM64-V8A Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Get Gradle wrapper cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        
      - name: Setup Android NDK
        run: |
          # Install NDK using sdkmanager
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
          echo "NDK installed successfully"
          ls -la $ANDROID_HOME/ndk/
      
      - name: Prepare signing config
        run: |
          if [ -n "${{ secrets.KEY_BASE64 }}" ]; then
            echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          fi

          if [ -n "${{ secrets.SIGNING_CONFIG }}" ]; then
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          fi
      
      - name: Configure ARM64-V8A only build
        run: |
          # Backup original build.gradle
          cp app/build.gradle app/build.gradle.original
          
          # Create a modified build.gradle that builds only arm64-v8a
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'

          def keystorePropertiesFile = rootProject.file("local.properties")
          def keystoreProperties = new Properties()
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

          android {
              compileSdkVersion = 35

              defaultConfig {
                  applicationId = "eu.faircode.netguard"
                  versionName = "2.334"
                  minSdkVersion 22
                  targetSdkVersion 35
                  versionCode = 2025101201
                  archivesBaseName = "NetGuard-v$versionName"

                  externalNativeBuild {
                      cmake {
                          cppFlags ""
                          arguments "-DANDROID_PLATFORM=android-22"
                      }
                  }

                  ndkVersion "25.2.9519653"
                  // Only build for arm64-v8a
                  ndk {
                      abiFilters 'arm64-v8a'
                  }

                  packagingOptions {
                      jniLibs {
                          useLegacyPackaging true
                      }
                  }
              }
              signingConfigs {
                  release {
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }

              externalNativeBuild {
                  cmake {
                      path "CMakeLists.txt"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled = true
                      proguardFiles.add(file('proguard-rules.pro'))
                      signingConfig signingConfigs.release
                      buildConfigField "boolean", "PLAY_STORE_RELEASE", "false"
                      buildConfigField "String", "HOSTS_FILE_URI", "\"https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts\""
                      buildConfigField "String", "GITHUB_LATEST_API", "\"https://api.github.com/repos/M66B/NetGuard/releases/latest\""
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }

              lint {
                  disable 'MissingTranslation'
              }
              namespace 'eu.faircode.netguard'
              buildFeatures {
                  aidl true
              }
          }

          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
              implementation 'androidx.recyclerview:recyclerview:1.3.1'
              implementation 'androidx.preference:preference:1.2.1'
              implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
              annotationProcessor 'androidx.annotation:annotation:1.7.0'
              implementation('com.github.bumptech.glide:glide:4.14.2') {
                  exclude group: "com.android.support"
              }
              annotationProcessor 'com.github.bumptech.glide:compiler:4.14.2'
          }
          EOF
          
          echo "Modified build.gradle to build only arm64-v8a"
      
      - name: Build ARM64-V8A Release APK
        run: |
          # Make gradlew executable
          chmod +x gradlew
          
          # Use the arm64-v8a specific build configuration
          ./gradlew assembleRelease \
            -Pandroid.injected.invoked.from.ide=true \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m" \
            --no-daemon \
            --stacktrace \
            -x lint \
            --warning-mode=all
            
      - name: Verify APK output
        run: |
          # Find and list the generated APK
          echo "Generated APK files:"
          find app/build/outputs -name "*.apk" -type f -exec ls -lh {} \;
          
          # Check if arm64-v8a APK exists
          ARM64_APK=$(find app/build/outputs -name "*arm64-v8a*release*.apk" | head -n 1)
          if [ -n "$ARM64_APK" ]; then
            echo "ARM64-V8A Release APK found: $ARM64_APK"
            echo "APK_SIZE=$(ls -lh "$ARM64_APK" | awk '{print $5}')" >> $GITHUB_ENV
          else
            echo "Warning: ARM64-V8A release APK not found in expected location"
            echo "All APKs:"
            find app/build/outputs -name "*.apk" -type f
          fi
      
      - name: Upload ARM64-V8A Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NetGuard-arm64-v8a-release
          path: app/build/outputs/apk/**/*arm64-v8a*release*.apk
          retention-days: 30
      
      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NetGuard-all-apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
